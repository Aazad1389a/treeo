<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TREEO | Survival Online</title>
<style>
:root{--accent:#7fd858;--accent2:#e8b24b;--danger:#e05c4d;--panel:rgba(10,18,14,.86);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Segoe UI,Tahoma,Arial,sans-serif}#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1c2b1e,#0a120c 60%,#050805);color:#eafbe6;text-align:center;gap:14px;padding:20px}.logo{font-size:52px;font-weight:900;letter-spacing:8px;color:#7fd858;text-shadow:0 8px 30px #000}.btn{cursor:pointer;border:1px solid var(--line);background:#18251b;color:#eafbe6;padding:12px 24px;border-radius:10px;font-weight:700}.primary{background:linear-gradient(180deg,#7fd858,#4f9c33);color:#0b1a0c;border:0}.inputs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.inputs input{background:#0e1a11;border:1px solid var(--line);color:#dff0da;padding:10px;border-radius:8px;width:220px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:20;display:none}.bar-wrap{position:absolute;bottom:18px;left:18px;width:230px;display:flex;flex-direction:column;gap:6px}.bar{height:14px;border-radius:7px;background:#0008;border:1px solid var(--line);overflow:hidden;position:relative}.bar i{display:block;height:100%}.bar span{position:absolute;inset:0;padding:0 8px;color:#fff;font-size:10px;text-shadow:0 1px 2px #000}.hp i{background:#e05c4d}.hungry i{background:#e8b24b}.stam i{background:#5aa8e0}.panel{position:absolute;top:14px;left:14px;background:var(--panel);padding:8px 12px;border:1px solid var(--line);border-radius:8px;color:#dfe;font-size:12px}.players{position:absolute;top:14px;right:14px;background:var(--panel);padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:#dfe;font-size:11px}.prompt{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:#0009;color:#fff;padding:6px 14px;border-radius:8px;display:none}.crosshair{position:absolute;top:50%;left:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff}.hotbar{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}.slot{width:52px;height:52px;background:#0008;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative}.slot.active{border-color:var(--accent)}.slot .cnt{position:absolute;bottom:2px;right:5px;color:#fff;font-size:10px}.bp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(460px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:none;pointer-events:auto;color:#fff}.crafts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.death{position:fixed;inset:0;background:#0a0000c9;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:40;color:#fff;gap:14px}.mobile{position:fixed;inset:0;z-index:15;display:none;pointer-events:none}.mbtn{position:absolute;pointer-events:auto;border-radius:50%;background:#ffffff26;border:1px solid #ffffff55;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700}.joy{position:absolute;bottom:34px;left:28px;width:110px;height:110px;border-radius:50%;background:#ffffff14;border:1px solid #ffffff40;pointer-events:auto}.knob{position:absolute;top:50%;left:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:#ffffff59}.look{position:absolute;top:0;right:0;width:55%;height:70%;pointer-events:auto}
</style></head><body><canvas id="c"></canvas><div id="splash"><div class="logo">TREEO</div><div>بقا، ساخت‌وساز و نبرد در یک دنیای باز</div><div class="inputs"><input id="inName" placeholder="نام بازیکن" maxlength="14"><input id="inUrl" placeholder="Supabase URL اختیاری"><input id="inKey" placeholder="Supabase anon key اختیاری"></div><button class="btn primary" id="btnPlay">ورود به بازی</button><small>بدون Supabase هم حالت تک‌نفره اجرا می‌شود.</small></div>
<div id="hud"><div class="panel">⏱ <span id="clockTxt">--:--</span> | 👥 <span id="cntTxt">1</span></div><div class="players" id="players"></div><div class="bar-wrap"><div class="bar hp"><i style="width:100%"></i><span>سلامتی</span></div><div class="bar hungry"><i style="width:100%"></i><span>گرسنگی</span></div><div class="bar stam"><i style="width:100%"></i><span>استامینا</span></div></div><div class="crosshair"></div><div class="prompt" id="promptText"></div><div class="hotbar" id="hotbar"></div><div class="bp" id="bpPanel"><b>🎒 کوله‌پشتی و ساخت</b><div id="bpGrid"></div><div class="crafts"><button class="btn" data-craft="bandage">ساخت باند</button><button class="btn" data-craft="ammo">ساخت فشنگ</button><button class="btn" data-craft="axe">ساخت تبر</button><button class="btn" id="btnSave">ذخیره</button></div></div></div>
<div class="death" id="deathScreen"><b style="font-size:26px">مُردی 💀</b><div>علت: <span id="deathReason"></span></div><button class="btn primary" id="btnRespawn">دوباره وارد شو</button></div>
<div class="mobile" id="mobileUI"><div class="joy" id="joyBase"><div class="knob" id="joyKnob"></div></div><div class="look" id="lookPad"></div><div class="mbtn" id="btnShoot" style="width:76px;height:76px;bottom:100px;right:26px">شلیک</div><div class="mbtn" id="btnJump" style="width:56px;height:56px;bottom:34px;right:118px">پرش</div><div class="mbtn" id="btnUse" style="width:56px;height:56px;bottom:34px;right:190px">برداشت</div><div class="mbtn" id="btnInv" style="width:44px;height:44px;top:14px;right:14px">🎒</div></div>
<script type="module" src="./src/main.js"></script></body></html>
